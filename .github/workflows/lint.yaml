name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # Pinned: forge 1.8+ sends an EIP-1898 block object in fork requests, which Hashio rejects
      # ("Expected 0x prefixed hexadecimal block number").
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Contract tests (real SaucerSwap on a live testnet fork)
        run: yarn foundry:test

      - name: Contract lint
        run: yarn foundry:lint

      - name: Frontend unit tests
        run: yarn next:test

      - name: Frontend lint
        run: yarn next:lint --max-warnings=0

      - name: Frontend types
        run: yarn next:check-types

      - name: Frontend build
        run: yarn next:build
